name: CI

permissions:
  contents: read

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal, main]

# Note: install uses `npm install` rather than `npm ci`, matching the
# Dockerfile. Lockfiles were generated on Windows and lack Linux-platform
# optional deps (e.g. @rollup/rollup-linux-x64-gnu, sharp's musl/glibc
# bindings); `npm ci` would fail strict-mode validation on the runner.
# This makes CI installs slightly non-deterministic — acceptable for a
# personal-scale fork; revisit if we ever need reproducibility guarantees.

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # No `cache:` here — server/package-lock.json is now untracked for
      # the same reason as client (Windows-generated lockfile lacked the
      # @rollup/rollup-linux-x64-gnu and similar platform-specific
      # optional deps; `npm install` still honoured the stale lockfile
      # and skipped them, vitest then crashed at `require('rollup')`).
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: cd server && npm install --no-audit --no-fund

      - name: Test
        run: cd server && npm test

  client:
    name: Client build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # No `cache:` here — client/package-lock.json is intentionally
      # untracked (Windows-generated lockfile lacks Linux sharp bindings),
      # so the setup-node cache resolver can't find a stable cache key.
      # The npm install below resolves from package.json fresh each run.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: cd client && npm install --no-audit --no-fund

      - name: Test
        run: cd client && npm test

      - name: Build (production bundle)
        run: cd client && npm run build

  # Single-file CI gate: deploys ONLY after server + client jobs succeed,
  # AND only on a push to `personal` (not on PRs to personal/main).
  #
  # Earlier this was a separate workflow_run-triggered file (deploy.yml),
  # but GitHub requires workflow_run trigger files to exist on the default
  # branch (main). Our default is the upstream-mirror branch which we
  # don't want to touch — so we keep the gate co-located with the tests
  # that drive it, and use `needs:` for ordering instead of workflow_run.
  deploy:
    name: Trigger Coolify deploy
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger 460tp deploy
        env:
          BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          UUID: ${{ secrets.COOLIFY_DEPLOY_UUID_460TP }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body -sS -X GET \
            "$BASE_URL/api/v1/deploy?uuid=$UUID&force=false" \
            -H "Authorization: Bearer $TOKEN"

      # [460-fork] VERIFY the deploy actually went live. The trigger above
      # only confirms Coolify ACCEPTED the webhook — it returns 200 even if
      # the subsequent build fails its healthcheck and Coolify rolls back to
      # the old container (which is exactly what silently happened for ~30
      # deploys: a boot-time SQLite error -> unhealthy -> rollback, while CI
      # stayed green). /api/health now reports the build commit; poll it
      # until it matches THIS commit, and FAIL the job if it never does.
      - name: Verify new build is actually serving
        env:
          APP_URL: https://460planner.pwkconsulting.org
          EXPECTED: ${{ github.sha }}
        run: |
          echo "Waiting for $APP_URL to report commit $EXPECTED ..."
          for i in $(seq 1 40); do
            LIVE=$(curl -fsS --max-time 10 "$APP_URL/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || echo "")
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "✓ Live build is $LIVE — deploy verified."
              exit 0
            fi
            echo "  attempt $i/40: live=[$LIVE] expected=[$EXPECTED] — waiting 15s"
            sleep 15
          done
          echo "::error::Deploy NOT verified after ~10min. Live /api/health did not report $EXPECTED."
          echo "::error::Coolify likely built but rolled back (unhealthy container). Check Coolify → 460tp → Deployments."
          exit 1
