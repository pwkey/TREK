name: CI

permissions:
  contents: read

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal, main]

# Note: install uses `npm install` rather than `npm ci`, matching the
# Dockerfile. Lockfiles were generated on Windows and lack Linux-platform
# optional deps (e.g. @rollup/rollup-linux-x64-gnu, sharp's musl/glibc
# bindings); `npm ci` would fail strict-mode validation on the runner.
# This makes CI installs slightly non-deterministic — acceptable for a
# personal-scale fork; revisit if we ever need reproducibility guarantees.

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: cd server && npm install --no-audit --no-fund

      - name: Test
        run: cd server && npm test

  client:
    name: Client build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # No `cache:` here — client/package-lock.json is intentionally
      # untracked (Windows-generated lockfile lacks Linux sharp bindings),
      # so the setup-node cache resolver can't find a stable cache key.
      # The npm install below resolves from package.json fresh each run.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: cd client && npm install --no-audit --no-fund

      - name: Test
        run: cd client && npm test

      - name: Build (production bundle)
        run: cd client && npm run build
