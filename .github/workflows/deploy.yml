name: deploy

# Triggers Coolify to redeploy 460 Trip Planner — but ONLY after CI passes.
# This is the gate: pushes to `personal` run CI; if CI is green, this
# workflow fires and tells Coolify to pull + rebuild. If CI is red,
# nothing deploys. Replaces Coolify's own "Watch repository for changes"
# auto-deploy (which bypasses CI).

on:
  workflow_run:
    workflows: ['CI']    # must match the `name:` of .github/workflows/ci.yml
    types: [completed]
    branches: [personal]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify deploy
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_branch == 'personal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger 460tp deploy
        env:
          BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          UUID: ${{ secrets.COOLIFY_DEPLOY_UUID_460TP }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body -sS -X GET \
            "$BASE_URL/api/v1/deploy?uuid=$UUID&force=false" \
            -H "Authorization: Bearer $TOKEN"
