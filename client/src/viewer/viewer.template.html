<!DOCTYPE html>
<!--
  [460-fork] Milestone 7 slice 5 — standalone offline viewer.

  Single self-contained HTML that opens a 460 Trip Planner bundle (.zip)
  from your local disk and renders the trip read-only without any
  server. Per CLAUDE.md §8.5 this is "the ultimate offline insurance":
  even if the whole 460 ecosystem disappears, the bundle remains
  human-readable.

  Drop this file (or unzip the bundle which contains it) and double-
  click it to open in any modern browser. Pick the .zip when
  prompted; everything else is local. "Print / Save as PDF" routes
  through the browser's print dialog.

  This file is generated by client/scripts/build-viewer.mjs from
  client/src/viewer/viewer.template.html with jszip inlined. Don't
  edit client/public/viewer.html directly — re-run the build.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>460 Trip Planner — Trip Viewer</title>
<style>
  :root {
    --bg: #f7f5f1;
    --bg-card: #ffffff;
    --text: #1f2937;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --border: #e5e7eb;
    --accent: #8b3a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .container { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 14px 16px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .topbar h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .spacer { flex: 1; }
  button, label.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    background: var(--bg-card); color: var(--text);
    border: 1px solid var(--border); cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
  }
  button:hover, label.btn:hover { background: #fff; }
  button.primary, label.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  input[type="file"] { display: none; }

  .picker {
    margin-top: 32px; padding: 32px;
    border: 1.5px dashed var(--border); border-radius: 14px;
    background: var(--bg-card); text-align: center;
  }
  .picker h2 { margin: 0 0 8px; font-size: 18px; }
  .picker p { margin: 0 0 16px; color: var(--text-muted); font-size: 13px; }
  .picker .footnote { margin-top: 16px; font-size: 11px; color: var(--text-faint); }

  .trip-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .trip-header h1 { margin: 0 0 4px; font-size: 24px; font-weight: 700; }
  .trip-header .meta { font-size: 12px; color: var(--text-muted); }
  .trip-header .meta strong { color: var(--text); font-weight: 600; }

  .day-card {
    margin-bottom: 32px; padding: 0; border-radius: 12px;
    background: var(--bg-card); border: 1px solid var(--border); overflow: hidden;
    page-break-inside: avoid;
  }
  .day-card header {
    padding: 12px 18px; background: #fafaf9; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px;
  }
  .day-card .day-number {
    font-size: 11px; font-weight: 600; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .day-card .day-date { font-size: 13px; color: var(--text-muted); }
  .day-card .day-title { font-size: 14px; font-weight: 600; margin-left: auto; color: var(--text); }
  .day-card .day-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

  .journal { font-size: 13px; line-height: 1.6; }
  .journal h1, .journal h2, .journal h3 { font-weight: 700; margin: 0.6em 0 0.3em; }
  .journal h1 { font-size: 1.3em; }
  .journal h2 { font-size: 1.15em; }
  .journal h3 { font-size: 1em; }
  .journal p { margin: 0 0 0.4em; }
  .journal ul, .journal ol { padding-left: 1.4em; margin: 0.3em 0; }
  .journal li { display: list-item; margin: 0.1em 0; }
  .journal a { color: #3b82f6; text-decoration: underline; }
  .journal blockquote { border-left: 3px solid var(--border); padding-left: 12px; margin: 0.5em 0; color: var(--text-muted); }

  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .photos figure { margin: 0; border-radius: 8px; overflow: hidden; background: #eee; position: relative; page-break-inside: avoid; }
  .photos img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .photos figcaption { padding: 4px 6px; font-size: 11px; color: var(--text); background: var(--bg-card); }
  .geotag {
    position: absolute; top: 4px; left: 4px;
    width: 22px; height: 22px; border-radius: 6px;
    background: rgba(0,0,0,0.55); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }

  .places-list { list-style: none; padding: 0; margin: 0; font-size: 12px; color: var(--text-muted); }
  .places-list li { display: flex; gap: 8px; padding: 2px 0; }
  .places-list .time { font-variant-numeric: tabular-nums; color: var(--text-faint); min-width: 44px; }

  .empty-day { font-size: 12px; color: var(--text-faint); font-style: italic; }

  .placeholder {
    width: 100%; height: 130px; background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-faint);
  }

  .error {
    padding: 12px; border-radius: 8px; margin: 16px 0;
    background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; font-size: 13px;
  }

  /* Print stylesheet — hide chrome, expand to full width, force per-day
     page breaks where they help. The browser's print dialog has a
     "Save as PDF" virtual destination; this stylesheet makes that
     output usable as a memoir keepsake. */
  @media print {
    :root { --bg: white; --bg-card: white; }
    body { font-size: 11pt; }
    .topbar, .picker { display: none !important; }
    .container { max-width: none; padding: 0; }
    .day-card { box-shadow: none; border: 1px solid #ccc; margin-bottom: 16pt; }
    .day-card header { background: white; }
    .photos img { height: auto; max-height: 4in; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>460 Trip Planner — Trip Viewer</h1>
  <span id="trip-name" style="color: var(--text-muted); font-size: 13px;"></span>
  <span class="spacer"></span>
  <label class="btn" for="file-input">Open another bundle…</label>
  <input id="file-input" type="file" accept=".zip,application/zip" />
  <button id="print-btn" class="primary" style="display:none">Print / Save as PDF</button>
</div>

<div class="container">
  <div id="picker" class="picker">
    <h2>Open a trip bundle</h2>
    <p>Pick a <strong>.zip</strong> previously created via the Bundle export button on a 460 Trip Planner trip.</p>
    <label class="btn primary" for="file-input-2">Choose file…</label>
    <input id="file-input-2" type="file" accept=".zip,application/zip" style="display:none" />
    <div class="footnote">
      Everything stays on your device. No server is contacted.
      <br />Use your browser's <em>Print</em> dialog to save the trip as a PDF.
    </div>
  </div>

  <div id="error-area"></div>
  <div id="trip-area"></div>
</div>

<!-- INLINED_JSZIP -->

<script>
(function () {
  'use strict';

  // ── Tiny markdown renderer ───────────────────────────────────────
  // Covers the subset our journal editor uses (CLAUDE.md §6: markdown
  // as source of truth). For richer rendering, paste the markdown into
  // a dedicated viewer. This deliberately avoids pulling in marked.js
  // to keep the viewer file tight; the resulting bundle stays small
  // (~110 KB) so the offline-insurance use case isn't hampered by
  // lazy-loading concerns.
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function renderMarkdown(src) {
    if (!src) return '';
    var lines = src.split(/\r?\n/);
    var out = [];
    var inList = null; // 'ul' | 'ol' | null
    var inBlockquote = false;
    function closeList() { if (inList) { out.push('</' + inList + '>'); inList = null; } }
    function closeQuote() { if (inBlockquote) { out.push('</blockquote>'); inBlockquote = false; } }
    function inline(s) {
      s = escapeHtml(s);
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
        return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
      });
      return s;
    }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (/^\s*$/.test(ln)) { closeList(); closeQuote(); continue; }
      var h = ln.match(/^(#{1,3})\s+(.+)$/);
      if (h) { closeList(); closeQuote(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue; }
      if (/^>\s+/.test(ln)) {
        closeList();
        if (!inBlockquote) { out.push('<blockquote>'); inBlockquote = true; }
        out.push('<p>' + inline(ln.replace(/^>\s+/, '')) + '</p>');
        continue;
      }
      closeQuote();
      var ul = ln.match(/^[-*]\s+(.+)$/);
      var ol = ln.match(/^\d+\.\s+(.+)$/);
      if (ul) {
        if (inList !== 'ul') { closeList(); out.push('<ul>'); inList = 'ul'; }
        out.push('<li>' + inline(ul[1]) + '</li>');
        continue;
      }
      if (ol) {
        if (inList !== 'ol') { closeList(); out.push('<ol>'); inList = 'ol'; }
        out.push('<li>' + inline(ol[1]) + '</li>');
        continue;
      }
      closeList();
      out.push('<p>' + inline(ln) + '</p>');
    }
    closeList(); closeQuote();
    return out.join('\n');
  }

  // ── Bundle loading + render ──────────────────────────────────────
  var pickerEl = document.getElementById('picker');
  var tripArea = document.getElementById('trip-area');
  var errorArea = document.getElementById('error-area');
  var tripNameEl = document.getElementById('trip-name');
  var printBtn = document.getElementById('print-btn');
  var fileInputs = [document.getElementById('file-input'), document.getElementById('file-input-2')];

  fileInputs.forEach(function (inp) {
    inp.addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) loadBundle(f);
      e.target.value = '';
    });
  });
  printBtn.addEventListener('click', function () { window.print(); });

  function showError(msg) {
    errorArea.innerHTML = '<div class="error">' + escapeHtml(msg) + '</div>';
  }

  async function loadBundle(file) {
    errorArea.innerHTML = '';
    tripArea.innerHTML = 'Loading…';
    try {
      var zip = await JSZip.loadAsync(file);
      var tripJsonEntry = zip.file('trip.json');
      if (!tripJsonEntry) throw new Error('Bundle is missing trip.json');
      var tripJson = await tripJsonEntry.async('string');
      var envelope;
      try { envelope = JSON.parse(tripJson); }
      catch (err) { throw new Error('trip.json is not valid JSON: ' + err.message); }

      // Extract photo binaries to object URLs keyed by attachment_path.
      var attachmentUrls = {};
      var attachmentEntries = zip.folder('attachments');
      if (attachmentEntries) {
        var paths = [];
        zip.forEach(function (path, entry) {
          if (path.indexOf('attachments/') === 0 && !entry.dir) paths.push(path);
        });
        for (var i = 0; i < paths.length; i++) {
          var p = paths[i];
          var blob = await zip.file(p).async('blob');
          attachmentUrls[p] = URL.createObjectURL(blob);
        }
      }
      render(envelope, attachmentUrls);
      pickerEl.style.display = 'none';
      printBtn.style.display = '';
    } catch (err) {
      tripArea.innerHTML = '';
      showError(err && err.message ? err.message : 'Could not load bundle');
    }
  }

  function render(envelope, urls) {
    var trip = envelope.trip || {};
    tripNameEl.textContent = trip.title || '(untitled trip)';
    document.title = (trip.title || 'Trip') + ' — 460 Trip Planner';

    var html = [];
    html.push('<header class="trip-header">');
    html.push('<h1>' + escapeHtml(trip.title || '(untitled trip)') + '</h1>');
    var meta = [];
    if (trip.start_date && trip.end_date) meta.push('<strong>' + escapeHtml(trip.start_date) + '</strong> to <strong>' + escapeHtml(trip.end_date) + '</strong>');
    else if (trip.start_date) meta.push('Starts <strong>' + escapeHtml(trip.start_date) + '</strong>');
    if (envelope.exported_by && envelope.exported_by.username) meta.push('Exported by <strong>' + escapeHtml(envelope.exported_by.username) + '</strong>');
    if (envelope.exported_at) meta.push('on ' + escapeHtml(new Date(envelope.exported_at).toLocaleString()));
    html.push('<div class="meta">' + meta.join(' · ') + '</div>');
    if (envelope.format === 'metadata-only') {
      html.push('<div class="meta" style="margin-top:6px;color:#a16207"><em>Metadata-only export — photo binaries are not included.</em></div>');
    }
    html.push('</header>');

    var days = (trip.days || []).slice().sort(function (a, b) {
      var ad = a.date || '', bd = b.date || '';
      if (ad === bd) return (a.day_number || 0) - (b.day_number || 0);
      return ad.localeCompare(bd);
    });

    if (days.length === 0) {
      html.push('<p style="color:var(--text-muted)">This trip has no days yet.</p>');
    } else {
      for (var i = 0; i < days.length; i++) html.push(renderDay(days[i], urls));
    }

    tripArea.innerHTML = html.join('\n');
  }

  function renderDay(day, urls) {
    var html = [];
    html.push('<article class="day-card">');
    html.push('<header>');
    html.push('<span class="day-number">Day ' + (day.day_number || '?') + '</span>');
    html.push('<span class="day-date">' + escapeHtml(formatDate(day.date)) + '</span>');
    if (day.title) html.push('<span class="day-title">' + escapeHtml(day.title) + '</span>');
    html.push('</header>');
    html.push('<div class="day-body">');

    var hasJournal = day.journal && day.journal.content_markdown && day.journal.content_markdown.trim();
    var photos = day.photos || [];
    var assignments = day.assignments || [];

    if (hasJournal) {
      html.push('<div class="journal">' + renderMarkdown(day.journal.content_markdown) + '</div>');
    } else {
      html.push('<div class="empty-day">No journal entry for this day.</div>');
    }

    if (photos.length > 0) {
      html.push('<div class="photos">');
      for (var i = 0; i < photos.length; i++) {
        var p = photos[i];
        var url = (p.attachment_path && urls[p.attachment_path]) ? urls[p.attachment_path] : null;
        html.push('<figure>');
        if (url) html.push('<img src="' + url + '" alt="' + escapeHtml(p.caption || '') + '" />');
        else html.push('<div class="placeholder">photo not in bundle</div>');
        if (p.lat != null && p.lng != null) html.push('<span class="geotag" title="Geotagged: ' + Number(p.lat).toFixed(5) + ', ' + Number(p.lng).toFixed(5) + '">📍</span>');
        if (p.caption) html.push('<figcaption>' + escapeHtml(p.caption) + '</figcaption>');
        html.push('</figure>');
      }
      html.push('</div>');
    }

    if (assignments.length > 0) {
      html.push('<ul class="places-list">');
      for (var j = 0; j < assignments.length; j++) {
        var a = assignments[j];
        var name = (a.place && a.place.name) || 'Unnamed place';
        var time = (a.place && a.place.place_time) || '';
        html.push('<li>');
        if (time) html.push('<span class="time">' + escapeHtml(time) + '</span>');
        html.push('<span>' + escapeHtml(name) + '</span>');
        html.push('</li>');
      }
      html.push('</ul>');
    }

    html.push('</div></article>');
    return html.join('\n');
  }

  function formatDate(iso) {
    if (!iso) return '';
    try {
      return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    } catch { return iso; }
  }
})();
</script>
</body>
</html>
